<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palhoça Cultural</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            font-size: 18px;
            margin-top: 12px;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<header>
    <h1>Palhoça Cultural</h1>
    <p>Agenda cultural de Palhoça e região</p>
</header>

<main>

    <div class="card">
        <h2>Calendário Cultural</h2>
        <p>
            Em breve você encontrará aqui os principais
            eventos culturais de Palhoça.
        </p>
    </div>

    <div class="card">
        <h2>Cadastre seu evento</h2>
        <p>
            Produtores culturais poderão enviar seus eventos
            para análise e publicação.
        </p>
    </div>

</main>

</body>
</html>
